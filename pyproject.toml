[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nbdev-test"
dynamic = ["version"]
description = ""
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "ab", email = "amar.bolkan@gmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Amar-Bolkan/nbdev-test"
Documentation = "https://Amar-Bolkan.github.io/nbdev-test/"

[project.entry-points.nbdev]
nbdev_test = "nbdev_test._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "nbdev_test.__version__"}

[tool.setuptools.packages.find]
include = ["nbdev_test"]

[tool.nbdev]
